name: build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, for example v0.1.0"
        required: true
      prerelease:
        description: "mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            archive: zip
            exe: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            archive: zip
            exe: .exe

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          out="dist/t23emu-${{ matrix.suffix }}"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/t23emu${{ matrix.exe }}" ./cmd/main.go
          go build -trimpath -ldflags="-s -w" -o "$out/imgscan${{ matrix.exe }}" ./cmd/imgscan
          cp README.md "$out/"

      - name: package tarball
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          cd dist
          tar -czf "t23emu-${{ matrix.suffix }}.tar.gz" "t23emu-${{ matrix.suffix }}"

      - name: package zip
        if: matrix.archive == 'zip'
        run: |
          set -euo pipefail
          cd dist
          zip -r "t23emu-${{ matrix.suffix }}.zip" "t23emu-${{ matrix.suffix }}"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: t23emu-${{ matrix.suffix }}
          path: dist/t23emu-${{ matrix.suffix }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: write checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > checksums.txt

      - name: publish github release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          args=(release create "$tag" release-assets/* --title "$tag" --generate-notes)
          if [ "${PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
